name: Check

# every push: install and build the app (main, preload, screens), so a broken build shows at once
on:
  push:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx tsc -p tsconfig.json
        continue-on-error: true
