name: RoarMail for the Mac App Store (TestFlight)

# Builds RoarMail for the Mac App Store (universal: Apple Silicon and Intel), signs it for the store and sends it to
# App Store Connect, where it shows in TestFlight once Apple has processed it (Alex, 19 Nov 2026). Run it from the
# Actions tab (Run workflow). Needs three repository secrets Alex adds himself (README, App Store): ASC_KEY_ID,
# ASC_ISSUER_ID and ASC_KEY_P8, an App Store Connect API key with the Admin role. Certificates and the profile are made
# by scripts/appstore.mjs for each run and the older ones taken away, so there is nothing to keep by hand.
on:
  workflow_dispatch:
    inputs:
      only_testers:
        description: 'Only put the ready builds in the TestFlight groups (no new build)'
        type: boolean
        default: false
      listing:
        description: 'Fill the App Store page: texts, category, age rating, price, build, review notes, screenshots (no new build)'
        type: boolean
        default: false
      submit:
        description: 'Send the version for App Review (no new build)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # every build Apple has finished with goes into every TestFlight group, and what Apple made of each is printed
  testers:
    if: ${{ inputs.only_testers && !inputs.listing && !inputs.submit }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/appstore.mjs distribute 1
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

  # the App Store page, with two pictures of the web demo at 2880 x 1800 (light and dark)
  listing:
    if: ${{ inputs.listing }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:renderer
      - name: Screenshots
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          mkdir -p shots
          google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=1440,900 --force-device-scale-factor=2 --virtual-time-budget=9000 --screenshot=shots/1-light.png "http://localhost:4173/?shot"
          google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=1440,900 --force-device-scale-factor=2 --virtual-time-budget=9000 --screenshot=shots/2-dark.png "http://localhost:4173/?shot&dark" || true
          python3 -c "import struct,sys,glob;[print(f, struct.unpack('>II', open(f,'rb').read()[16:24])) for f in sorted(glob.glob('shots/*.png'))]"
      - uses: actions/upload-artifact@v4
        with:
          name: appstore-screenshots
          retention-days: 3
          path: shots
      - run: node scripts/appstore.mjs listing shots
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

  submit:
    if: ${{ inputs.submit }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/appstore.mjs submit
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

  testflight:
    if: ${{ !inputs.only_testers && !inputs.listing && !inputs.submit }}
    runs-on: macos-latest
    env:
      KCPASS: ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      # keys made here, certificates and the profile made by App Store Connect for them
      - name: Certificates and profile
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          D="$RUNNER_TEMP/asc"; mkdir -p "$D"
          KC="$RUNNER_TEMP/roarmail-ci.keychain-db"; echo "KC=$KC" >> "$GITHUB_ENV"
          for k in app installer; do
            openssl req -new -newkey rsa:2048 -nodes -keyout "$D/$k.key" -subj "/CN=RoarMail CI $k/C=GR" -out "$D/$k.csr" 2>/dev/null
          done
          node scripts/appstore.mjs prepare "$D"
          TEAM=$(openssl x509 -inform der -in "$D/app.cer" -noout -subject | sed -n 's/.*OU *= *\([A-Z0-9]\{10\}\).*/\1/p')
          if [ -z "$TEAM" ]; then echo "::error::no team in the certificate"; exit 1; fi
          echo "TEAM=$TEAM" >> "$GITHUB_ENV"
          sed -i '' "s/TEAMID/$TEAM/" build/entitlements.mas.plist
          node -e "const f='package.json',p=require('./'+f);p.build.mas.extendInfo.ElectronTeamID='$TEAM';require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
          # a keychain of its own for this run, with Apple's intermediate certificates
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          for c in AppleWWDRCAG3 AppleWWDRCAG6 DeveloperIDG2CA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$c.cer" -o "$D/$c.cer" && security import "$D/$c.cer" -k "$KC" -A || true
          done
          for k in app installer; do
            openssl x509 -inform der -in "$D/$k.cer" -out "$D/$k.pem"
            openssl pkcs12 -export -inkey "$D/$k.key" -in "$D/$k.pem" -out "$D/$k.p12" -passout pass:"$KCPASS" -legacy 2>/dev/null \
              || openssl pkcs12 -export -inkey "$D/$k.key" -in "$D/$k.pem" -out "$D/$k.p12" -passout pass:"$KCPASS"
            security import "$D/$k.p12" -k "$KC" -P "$KCPASS" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v "$KC"
          # the certificate's name for electron-builder (the plain Mac build has identity null, which the store build must not take)
          NAME=$(security find-identity -v "$KC" | sed -n 's/.*"Apple Distribution: \(.*\)"$/\1/p' | head -1)
          if [ -z "$NAME" ]; then echo "::error::the Apple Distribution certificate is not in the keychain"; exit 1; fi
          echo "MAS_ID=$NAME" >> "$GITHUB_ENV"
          rm -f "$D"/*.key "$D"/*.p12

      - name: Build for the App Store
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_KEYCHAIN: ${{ runner.temp }}/roarmail-ci.keychain-db
        run: |
          npm run build
          npx electron-builder --mac mas --universal --publish never -c.buildVersion=${{ github.run_number }} -c.mas.identity="$MAS_ID"
          ls -la out out/mas-universal 2>/dev/null || true

      - name: Send to App Store Connect (TestFlight)
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          PKG=$(ls out/*.pkg out/mas-universal/*.pkg 2>/dev/null | head -1 || true)
          if [ -z "$PKG" ]; then echo "::error::no .pkg was made"; exit 1; fi
          echo "sending $PKG"
          # altool where Xcode still has it, else Apple's Transporter (same API key, read from ~/.appstoreconnect/private_keys)
          T=$(ls /Applications/Xcode*.app/Contents/SharedFrameworks/ContentDeliveryServices.framework/Itms/bin/iTMSTransporter 2>/dev/null | head -1 || true)
          set +e
          if xcrun --find altool >/dev/null 2>&1; then
            xcrun altool --upload-app --type macos --file "$PKG" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal > upload.log 2>&1
          elif [ -n "$T" ]; then
            "$T" -m upload -assetFile "$PKG" -apiKey "$ASC_KEY_ID" -apiIssuer "$ASC_ISSUER_ID" -v informational > upload.log 2>&1
          else
            echo "neither altool nor Transporter is on this Mac" > upload.log; false
          fi
          rc=$?
          set -e
          cat upload.log | tail -60
          if grep -qi "no suitable application records\|could not find the app\|app record\|bundle.*not.*found\|cannot be found" upload.log; then
            echo "::error title=No RoarMail in App Store Connect yet::Make the app once: App Store Connect > Apps > + > New App > macOS, name RoarMail, bundle ID com.themadlions.roarmail. Then run this again."
            exit 1
          fi
          if [ $rc -ne 0 ] || grep -qi "ERROR ITMS\|Failed to upload\|error:" upload.log && ! grep -qi "No errors uploading\|UPLOAD SUCCEEDED\|successfully uploaded" upload.log; then
            echo "::error title=Upload::$(grep -i "error" upload.log | head -5 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          echo "::notice title=Sent::RoarMail is in App Store Connect; TestFlight shows it once Apple has processed it (often 10 to 30 minutes)."

      - name: Into the TestFlight groups
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: node scripts/appstore.mjs distribute 25 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roarmail-appstore
          retention-days: 1
          path: out/**/*.pkg
          if-no-files-found: ignore

      - name: Take away older certificates and profiles
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: node scripts/appstore.mjs tidy || true

      - name: Remove the keychain
        if: always()
        shell: bash
        run: |
          security delete-keychain "$KC" 2>/dev/null || true
          rm -rf ~/.appstoreconnect
